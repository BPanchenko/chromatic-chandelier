<!DOCTYPE html>
<html lang="ru">

<head>
    <title>Stix Two Math</title>
    <meta charset="utf-8">

    <link href="../demo.css" rel="stylesheet" type="text/css">
    <link href="./stix-math.css" rel="stylesheet" type="text/css">

    <style>
        button,
        main {
            font-family: stix-two-math;
        }
    </style>

    <script type="module">
        import { initTTFFont, makeCharacterMap } from '../toolkit.js';

        // 0) initializing

        const codeset = new Set();
        const font = await initTTFFont('stix-two-math.woff2');
        const otfstate = new Map();

        // 1) references to DOM

        const $charset = document.querySelector('.js-charset-container');
        const $featset = document.querySelector('.js-featset-container');
        const $glyph = document.querySelector('.js-glyph-view');
        const $root = document.querySelector('.js-root-container');

        // 2.a) helpers

        const renderCharacterButton = code => {
            let $char = document.createElement('button')
            $char.dataset.codepoint = code
            $char.dataset.unicode = 'U+' + code.toString(16).padStart(4, '0')
            $char.innerText = String.fromCodePoint(code)

            $char.onclick = event => {
                let { codepoint } = event.target.dataset
                renderCharacter(parseInt(codepoint))
            }

            $charset.appendChild($char)
            return $charset;
        }

        const renderOTFeatureButton = feat => {
            let $feat = document.createElement('button');
            $feat.dataset.style = feat;
            $feat.innerText = feat;
            $feat.setAttribute('aria-selected', 'false');

            $feat.onclick = event => {
                let { style } = event.target.dataset
                let toTurnOn = event.target.getAttribute('aria-selected') === 'false'
                applyOTFeature(style, toTurnOn)
            };

            $featset.appendChild($feat);
            return $feat;
        }

        // 3) initial run-time code

        {
            for (let feat of font.availableFeatures)
                if (false === otfstate.has(feat))
                    otfstate.set(feat, {
                        $elem: renderOTFeatureButton(feat),
                        selected: false
                    });
            for (let code of font.characterSet) codeset.add(code);

            let featset = new Set(font.availableFeatures);
            let charmap = makeCharacterMap(font);

            console.groupCollapsed(font.postscriptName);
            console.log({
                charmap,
                featset,
            })
            console.groupEnd();

            for (let codepoint of codeset.values()) renderCharacterButton(codepoint)
        }

        // 2.b) helpers

        function applyOTFeature(feat, selected) {
            let otfitem = otfstate.get(feat);
            otfitem.$elem.setAttribute('aria-selected', otfitem.selected = selected);

            $root.style.fontFeatureSettings = '"' + otfstate
                .entries()
                .filter(([_, item]) => item.selected)
                .map(([feat]) => feat)
                .toArray()
                .join('", "') + '"'
        }

        function renderCharacter(code) {
            $glyph.innerText = String.fromCodePoint(code)
        }
    </script>

</head>

<body>
    <marquee bgcolor="mediumaquamarine" behavior="scroll" direction="left" scrollamount="2">
        <strong>stix-two-math</strong>
        <em>no-italic</em>
        <em>regular</em>
    </marquee>
    <main class="js-root-container">
        <div role="listbox" class="w-featset js-featset-container"></div>
        <div role="presentation" class="w-glyph js-glyph-view"></div>
        <div role="listbox" class="w-charset js-charset-container"></div>
    </main>
</body>

</html>
