:is(ellipse, path, rect, circle){
	stroke-linecap: round;
	stroke-linejoin: round;

	&amp;:not([fill]) {
		fill: none;
	}
}

.e-point {
	backdrop-filter: blur(10px);
    r: 1.375px;
}

.o-csys {
	:is(ellipse, path) {
		stroke-dasharray: 4 2 2;
		stroke-width: 0.2px;
		stroke: slategray;

		&amp;:not([fill]) {
			fill: transparent;
		}
	}

	.e-axis-line {
		stroke-width: 0.3px;
		stroke: slategray;
	}
}


