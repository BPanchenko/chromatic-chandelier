			<path d="M 11.6,40 A 11.5,11.5 0,0,0 0,20 z" />
		</symbol>
		<symbol id="sym-hexagon-1" width="46" height="40" viewBox="0 0 46 40">
			<path d="M 11.6,0 A 11.5,11.5 0,0,0 34.6,0 z" />
			<path d="M 34.6,0 A 11.5,11.5 0,0,0 46,20 z" />
			<path d="M 46,20 A 11.5,11.5 0,0,0 34.6,40 z" />
			<path d="M 34.6,40 A 11.5,11.5 0,0,0 11.6,40 z" />
			<path d="M 11.6,40 A 11.5,11.5 0,0,0 0,20 z" />
		</symbol>
		<symbol id="sym-hexagon-2" width="46" height="40" viewBox="0 0 46 40">
			<path d="M 11.6,0 A 11.5,11.5 0,0,0 34.6,0 z" />
			<path d="M 34.6,0 A 11.5,11.5 0,0,0 46,20 z" />
