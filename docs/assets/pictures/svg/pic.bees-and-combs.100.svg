<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 320 160" width="420" height="210" id="root">
	<defs>
		<symbol id="sym-hexagon" width="46" height="40" viewBox="0 0 46 40">
			<path d="M 0,20 A 11.5,11.5 0,0,0 11.6,0 z" />
			<path d="M 11.6,0 A 11.5,11.5 0,0,0 34.6,0 z" />
			<path d="M 34.6,0 A 11.5,11.5 0,0,0 46,20 z" />
